name: product spring boot App to docker

on:
  push:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check Java version
        run: java --version

      - name: Build and Test (maven)
        working-directory: product-backend
        run: mvn -B clean verify

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: product-backend/target/surefire-reports





  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build JAR for docker
        working-directory: product-backend
        run: mvn -B clean package -DskipTests

      - name: Login to Dockerhub
        uses: docker/login-action@v4
        with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: product-backend
          push: true
          tags: |
              ${{ secrets.DOCKERHUB_USERNAME }}/product-backend:${{ github.run_number }}

