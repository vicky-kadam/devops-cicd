name: product spring boot App to docker

on:
  push:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check Java version
        run: java --version

      - name: Build and Test (maven)
        working-directory: product-backend
        run: mvn -B clean verify

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: product-backend/target/surefire-reports


  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build JAR for docker
        working-directory: product-backend
        run: mvn -B clean package -DskipTests

      - name: Login to Dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: product-backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-backend:${{ github.run_number }}
            ${{ secrets.DOCKERHUB_USERNAME }}/product-backend:latest


  # NAYA: minikube mein deploy (tumhare laptop ke self-hosted runner par, Windows PowerShell)
  deploy:
    runs-on: self-hosted
    needs: docker-build-push
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Minikube check
        run: |
          kubectl get nodes
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: mysql-secret banao (agar pehle se nahi hai)
        run: |
          $s = kubectl get secret mysql-secret --ignore-not-found -o name
          if (-not $s) {
            kubectl create secret generic mysql-secret --from-literal=MYSQL_ROOT_PASSWORD='${{ secrets.MYSQL_ROOT_PASSWORD }}'
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: MySQL aur Service apply karo
        run: |
          kubectl apply -f k8s/mysql.yml
          if ($LASTEXITCODE -ne 0) { exit 1 }
          kubectl apply -f k8s/service.yml
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Backend ko is run ke image tag ke saath deploy karo
        run: |
          $img = "${{ secrets.DOCKERHUB_USERNAME }}/product-backend:${{ github.run_number }}"
          (Get-Content k8s/deployment.yml) -replace 'image: .*product-backend:.*', "image: $img" | Set-Content k8s/deployment.yml
          kubectl apply -f k8s/deployment.yml
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Pods ready hone tak wait karo
        run: |
          kubectl rollout status deployment/mysql --timeout=180s
          if ($LASTEXITCODE -ne 0) { exit 1 }
          kubectl rollout status deployment/product-backend-deployment --timeout=300s
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Fail hone par debug info
        if: failure()
        run: |
          kubectl get pods
          kubectl describe pods -l app=product-backend | Select-Object -Last 40
          kubectl logs -l app=product-backend --tail=50
          exit 0