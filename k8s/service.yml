apiVersion: v1
kind: Service
metadata:
  name: product-backend-service
spec:
  type: NodePort
  selector:
    app: product-backend
  ports:
    - protocol: TCP
      port: 8080        # service ka port
      targetPort: 8080  # container ka port
      nodePort: 30080   # bahar se access ke liye (30000-32767)