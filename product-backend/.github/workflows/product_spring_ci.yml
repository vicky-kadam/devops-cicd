name: product spring boot App to docker

on:
  push:
    build-test:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: setup Jdk
          uses: actions/setup-java@v6
          with:
                distribution: temurin
                java-version: '25'
          run: java --version


        - name: Build and Test (maven)
          working-directory: /Users/vicky/OneDrive/Desktop/AReact/prduct/product-backend
          run: mvn -B clean verify

        - name: Upload Test Reports
        - uses: actions/upload-artifact@v4
          with:
          name: test-reports
          path: /Users/vicky/OneDrive/Desktop/AReact/prduct/product-backend/target/surefire-reports



